# dsh-web-pets bundle patch: inserts its plugin row into the web profile roster.
# Install via `dsh plugin --profile <name> add link:<path>/plugins/dsh-web-pets`
# or as a `file:` dependency + this insert row in the profile's cordis.patch.yml.
- insert:
    - id: web-pets
      name: 'dsh-web-pets'
