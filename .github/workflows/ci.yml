name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-pets:
    name: dsh-web-pets (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/dsh-web-pets
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugins/dsh-web-pets/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
