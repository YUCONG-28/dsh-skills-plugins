name: Release dsh-web-pets

on:
  push:
    tags:
      - 'web-pets-v*'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布/重发的版本号（例如 0.2.2）'
        required: true
        default: '0.2.2'

permissions:
  contents: write

jobs:
  release:
    name: Build, test, pack & publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/dsh-web-pets
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: plugins/dsh-web-pets/pnpm-lock.yaml

      - name: Determine version & tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#web-pets-v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=web-pets-v$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=web-pets-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install & test
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: Pack tarball + SHA256
        run: |
          mkdir -p dist
          pnpm pack --pack-destination dist
          TARBALL=$(ls dist/dsh-web-pets-*.tgz)
          shasum -a 256 "$TARBALL" | awk '{print $1"  "$2}' > dist/SHA256SUMS.txt
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Publish to npm (skips if NPM_TOKEN absent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --access public
          else
            echo "NPM_TOKEN not configured; skipping npm publish"
          fi

      - name: Create or skip GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES=$(awk '/^## v'"$VERSION"'/{flag=1;next}/^## /{if(flag)exit}flag' CHANGELOG.md)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skip creation"
          else
            gh release create "$TAG" \
              dist/dsh-web-pets-*.tgz \
              dist/SHA256SUMS.txt \
              --title "dsh-web-pets v$VERSION" \
              --notes "${NOTES:-dsh-web-pets v$VERSION}"
          fi

